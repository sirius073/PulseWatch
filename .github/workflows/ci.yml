name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pulsewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify Go Module Tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (with Race Detector & DB Connection)
        env:
          GOTOOLCHAIN: local        
          DB_HOST: localhost        
          DB_PORT: 5432
          DB_USER: pulsewatch
          DB_PASSWORD: password
          DB_NAME: pulsewatch
          DB_SSLMODE: disable
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
