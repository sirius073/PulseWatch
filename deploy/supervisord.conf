[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:pulsewatch-server]
command=/usr/local/bin/pulsewatch-server
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    PORT="%(ENV_PORT)s",
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    SIDECAR_ADDR="%(ENV_SIDECAR_ADDR)s",
    GIN_MODE="%(ENV_GIN_MODE)s"

[program:sidecar]
command=python -m uvicorn sidecar.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    DATABASE_URL="%(ENV_DATABASE_URL)s"
