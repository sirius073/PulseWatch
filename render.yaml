# Render.com deployment manifest for PulseWatch
# Docs: https://render.com/docs/yaml-spec
#
# Deploy steps:
#  1. Fork / push this repo to GitHub
#  2. Connect the repo in Render dashboard → "New → Blueprint"
#  3. Render will provision a free PostgreSQL database + a free Web Service
#  4. Set DATABASE_URL in the web service env vars to the internal connection string
#     from the provisioned database (Render does this automatically via fromDatabase).
#  5. First deploy runs `psql $DATABASE_URL -f server/migrations/001_init.sql`
#     automatically inside the container's CMD.

services:
  - type: web
    name: pulsewatch
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    # Render free tier: 512 MB RAM, shared CPU, spins down after 15 min inactivity
    # The agent reconnects automatically on spin-up.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: SIDECAR_ADDR
        value: "http://127.0.0.1:8000"
      - key: GIN_MODE
        value: release

databases:
  - name: pulsewatch-db
    plan: free
    postgresMajorVersion: 16
    # NOTE: TimescaleDB extension is NOT available on Render's managed Postgres.
    # The server migrations use regular Postgres hypertable-free schema when
    # TIMESCALEDB_ENABLED=false (default).  Set to "true" only on self-hosted
    # Postgres with the TimescaleDB extension installed.
